[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonarremedy"
version = "0.1.0"
description = "Recover Sonar technical debt automatically — a proposal-only worker swarm with a serial integrator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["sonar", "sonarqube", "technical-debt", "code-quality", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.scripts]
sonarremedy = "sonar_remedy:main"
sonar-remedy-mcp = "sonar_remedy_mcp:serve"
sonar-remedy-config = "sonar_remedy_config:main"

[tool.setuptools]
py-modules = [
    "sonar_remedy", "sonar_remedy_config", "sonar_remedy_mcp",
    "debt_work", "debt_queue", "debt_executor", "debt_runner", "debt_transport", "debtpack",
    "sonar_client", "sonar_fetch", "sonar_local", "sonar_exclusions", "sonar_gateway",
]
