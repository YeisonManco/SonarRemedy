[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonarremedy"
version = "0.7.2"
description = "Recover Sonar technical debt automatically — a proposal-only worker swarm with a serial integrator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["sonar", "sonarqube", "technical-debt", "code-quality", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.scripts]
sonarremedy = "sonar_remedy:main"
sonar-remedy-mcp = "sonar_remedy_mcp:serve"
sonar-remedy-config = "sonar_remedy_config:main"

[tool.setuptools]
py-modules = [
    "sonar_remedy", "sonar_remedy_config", "sonar_remedy_mcp",
    "debt_work", "debt_queue", "debt_executor", "debt_runner", "debt_transport", "debtpack",
    "sonar_client", "sonar_fetch", "sonar_local", "sonar_exclusions", "sonar_gateway",
    "sonar_suppressions", "sonar_exclusions_report", "sonar_hooks",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]
# Nested `with` in tests (e.g. `with patch.object(...): with self.assertRaises(...):`)
# is intentionally kept for readability; SIM117 wants them flattened.
ignore = ["SIM117"]
